<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Reference board — portfolio themes</title>
    <style>
      @page { margin: 0 }
      * { box-sizing: border-box }
      body {
        margin: 0;
        padding: 56px 56px 64px;
        width: 1640px;
        background: #f7f4ed;
        color: #1c1a17;
        font-family: -apple-system, "Helvetica Neue", sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      header { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 1px solid #d8d1c2; padding-bottom: 18px; margin-bottom: 30px }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: 40px; margin: 0; letter-spacing: -0.02em; font-weight: 500 }
      .sub { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: #7a7264 }
      .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 30px 26px }
      figure { margin: 0 }
      .shot { position: relative; border: 1px solid #cfc7b6; background: #fff; overflow: hidden }
      .shot img { display: block; width: 100%; height: 236px; object-fit: cover; object-position: top center }
      .num {
        position: absolute; top: 8px; left: 8px; z-index: 2;
        font: 600 11px/1 ui-monospace, monospace; letter-spacing: 0.08em;
        background: #1c1a17; color: #f7f4ed; padding: 5px 7px;
      }
      figcaption { padding-top: 10px }
      .name { font-size: 16px; font-weight: 600; letter-spacing: -0.01em }
      .url { font: 11px/1.5 ui-monospace, monospace; color: #8a5a2b; margin-top: 2px }
      .steal { font-size: 13px; line-height: 1.45; color: #4a453d; margin-top: 6px }
      .steal b { color: #1c1a17 }
      footer { margin-top: 34px; border-top: 1px solid #d8d1c2; padding-top: 16px; font-size: 12.5px; color: #7a7264; display: flex; justify-content: space-between }
    </style>
  </head>
  <body>
    <header>
      <div>
        <div class="sub">Reference board · the AI-transitioning data analyst</div>
        <h1>Nine references worth stealing from</h1>
      </div>
      <div class="sub">captured 25 Oct 2026 · 1440×900 viewport</div>
    </header>

    <div class="grid">
      <figure>
        <div class="shot"><span class="num">01</span><img src="../shots/refs/degenesis.png" alt="" /></div>
        <figcaption>
          <div class="name">DEGENESIS — the gothic original</div>
          <div class="url">degenesis.com</div>
          <div class="steal">Full-bleed dark art, a <b>spiked display wordmark</b>, one red accent, rotated vertical rails carrying the nav, tracked-out micro-caps at the foot. Steal the rails + the one-colour discipline, not the art.</div>
        </figcaption>
      </figure>

      <figure>
        <div class="shot"><span class="num">02</span><img src="../shots/refs/terminalshop.png" alt="" /></div>
        <figcaption>
          <div class="name">terminal.shop — the console</div>
          <div class="url">terminal.shop</div>
          <div class="steal">The page <b>is</b> a numbered code listing: syntax-comment labels, an orange caret on the live line, tabs with the active one inverted. Per-line numbering is the cheapest way to look engineered.</div>
        </figcaption>
      </figure>

      <figure>
        <div class="shot"><span class="num">03</span><img src="../shots/refs/brittanychiang.png" alt="" /></div>
        <figcaption>
          <div class="name">Brittany Chiang — the dark archetype</div>
          <div class="url">brittanychiang.com</div>
          <div class="steal">Near-black navy, mint accent, spotlight glow, identity left / prose right, <b>sticky year rail</b> in front of each role. The safe dark baseline every recruiter already knows how to read.</div>
        </figcaption>
      </figure>

      <figure>
        <div class="shot"><span class="num">04</span><img src="../shots/refs/distill.png" alt="" /></div>
        <figcaption>
          <div class="name">Distill — the evidence ledger</div>
          <div class="url">distill.pub</div>
          <div class="steal">Each work = a row of <b>date + badge | title, authors, deck | figure</b>. Peer-review stamps read as rigour. The strongest format for proving data-science capability rather than claiming it.</div>
        </figcaption>
      </figure>

      <figure>
        <div class="shot"><span class="num">05</span><img src="../shots/refs/pudding.png" alt="" /></div>
        <figcaption>
          <div class="name">The Pudding — the data journal</div>
          <div class="url">pudding.cool</div>
          <div class="steal">Work numbered like issues (<b>#226 · OCT 2026</b>), one saturated colour block per piece, lowercase black display titles, small serif decks. Turns four projects into a catalogue.</div>
        </figcaption>
      </figure>

      <figure>
        <div class="shot"><span class="num">06</span><img src="../shots/refs/yanholtz.png" alt="" /></div>
        <figcaption>
          <div class="name">Yan Holtz — the instrument panel</div>
          <div class="url">www.yan-holtz.com</div>
          <div class="steal">A live graph drawn behind the headline, serif display, teal accent — and a <b>position, not a skills list</b>: "In the AI era, D3 is the only reasonable choice." Steal the stance.</div>
        </figcaption>
      </figure>

      <figure>
        <div class="shot"><span class="num">07</span><img src="../shots/refs/maggieappleton.png" alt="" /></div>
        <figcaption>
          <div class="name">Maggie Appleton — the warm editorial</div>
          <div class="url">maggieappleton.com</div>
          <div class="steal">Cream paper, huge sentence-case serif, and the line "currently exploring AI &amp; software engineering". The honest transition frame, written as a <b>sentence about you</b>, not a headline about ambition.</div>
        </figcaption>
      </figure>

      <figure>
        <div class="shot"><span class="num">08</span><img src="../shots/refs/rauno.png" alt="" /></div>
        <figcaption>
          <div class="name">Rauno Freiberg — one graphic object</div>
          <div class="url">rauno.me</div>
          <div class="steal">A single bright disc, name-as-sentence in tight sans, everything else microscopic. Confident and memorable, but says nothing about data — use as the <b>identity layer</b>, not the whole site.</div>
        </figcaption>
      </figure>

      <figure>
        <div class="shot"><span class="num">09</span><img src="../shots/refs/a1dark.png" alt="" /></div>
        <figcaption>
          <div class="name">A1 Gallery — the dark index</div>
          <div class="url">a1.gallery/style/dark</div>
          <div class="steal">200 dark sites in one grid. Their own summary is the recipe: <b>deep greys, light type, one accent, imagery that pops</b>. Mine this whenever the palette needs a second opinion.</div>
        </figcaption>
      </figure>
    </div>

    <footer>
      <span>Full-size captures: shots/refs/*.png · written analysis: docs/references.md</span>
      <span>Eight themes + one index · Lakshmi Sindhu Pulugundla</span>
    </footer>
  </body>
</html>
